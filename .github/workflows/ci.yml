name: CI

on:
  push:
  pull_request:

jobs:
  core:
    # The Rust core: vault, dates, extraction checks, reminders, calendar, search, the UniFFI API.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        working-directory: core
        run: cargo fmt --check
      - name: Tests
        working-directory: core
        run: cargo test
      - name: The desktop CLI builds
        working-directory: core
        run: cargo build --features cli --bin docket

  native:
    # Page detection, clean-up and OCR (OpenCV + Tesseract built from the pinned sources).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools and OpenCV
        run: sudo apt-get update && sudo apt-get install -y ninja-build libopencv-dev
      - uses: actions/cache@v4
        with:
          path: |
            native/third_party/downloads
            native/third_party/install/host
          key: native-host-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/build-deps.sh') }}
      - name: Leptonica and Tesseract
        run: bash scripts/fetch-deps.sh && ( [ -f native/third_party/install/host/lib/cmake/tesseract/TesseractConfig.cmake ] || bash scripts/build-deps.sh host )
      - name: Build
        run: |
          cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/native/third_party/install/host"
          cmake --build native/build
      - name: Tests
        run: ctest --test-dir native/build --output-on-failure

  tools:
    # The evaluation harness's scoring.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow
      - name: Tests
        working-directory: tools
        run: python -m unittest discover -s tests -t . -v

  android:
    # The app: the Rust core for arm64 and x86_64 (cargo-ndk), its Kotlin bindings (UniFFI), the
    # native library (OpenCV, Tesseract, llama.cpp) and the Compose UI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: NDK, CMake and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.6" "platforms;android-37.0" > /dev/null
          cargo install cargo-ndk --locked
          sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: |
            native/third_party/downloads
            native/third_party/install/android-arm64-v8a
            native/third_party/install/android-x86_64
          key: native-android-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/build-deps.sh') }}
      - name: Native dependencies for Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          bash scripts/fetch-deps.sh android
          for abi in arm64-v8a x86_64; do
            [ -f native/third_party/install/android-$abi/lib/libtesseract.a ] || bash scripts/build-deps.sh android $abi
          done
      - name: Build the app
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: docket-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

# The evaluations with the language model (tools/docket_tools/evaluate.py) and the emulator run
# locally: they need the 1.9 GB model.
